openapi: 3.1.0
info:
  title: CalendarSchool API
  version: 0.1.0
  description: |
    API de CalendarSchool. Toda la API se sirve bajo el prefijo `/api`.

    **Formato de respuesta común.** Las respuestas correctas siguen la forma
    `{ "success": true, "data": { ... } }` y los errores, el componente `ErrorResponse`.
    El campo `error.code` es un identificador estable en inglés que el frontend traduce
    mediante i18n; `error.message` está en castellano, va dirigido a desarrolladores y el
    frontend nunca lo muestra al usuario.

    **Errores comunes a cualquier ruta bajo `/api`:** `400 INVALID_JSON` (cuerpo JSON mal
    formado), `404 NOT_FOUND` (ruta inexistente), `413 PAYLOAD_TOO_LARGE` (cuerpo de más de
    100 KB), `415 UNSUPPORTED_MEDIA_TYPE` (`charset` o `Content-Encoding` no soportado),
    `500 INTERNAL_ERROR` (error no controlado, sin traza) y `503 REQUEST_TIMEOUT` (la petición
    supera los 10 segundos). Se definen como
    respuestas reutilizables en `components.responses` para que las historias siguientes las
    referencien.

    **Errores reutilizables por los endpoints que los necesitan:** `400 VALIDATION_ERROR`
    (`ValidationError`, con un elemento `{ field, code }` en `details` por cada campo no
    válido) y `429 TOO_MANY_REQUESTS` (`TooManyRequests`, con la cabecera `Retry-After`).
servers:
  - url: /
    description: Mismo origen que el frontend (proxy de Vite en local)
tags:
  - name: Health
    description: Estado del servicio
  - name: Auth
    description: Registro y sesión de los usuarios
  - name: Municipalities
    description: Municipios de la Comunitat Valenciana
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Estado del servicio y de la base de datos
      # Endpoint público: no requiere autenticación.
      security: []
      description: |
        Informa del estado del servicio y de la conexión a la base de datos. No requiere
        autenticación y nunca expone detalles internos (versión de PostgreSQL, host,
        credenciales ni trazas). La comprobación de la base de datos tiene un timeout propio
        de 2 segundos.
      responses:
        '200':
          description: El servicio y la base de datos están disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: ok
                  database: up
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Registra un colegio y su usuario administrador
      # Endpoint público: no requiere autenticación.
      security: []
      description: |
        Crea en una única operación el colegio y su usuario, que queda como administrador del
        colegio. Orden de procesamiento: límite de intentos (`429`) → verificación de reCAPTCHA
        (`422`) → validación de la entrada (`400`) → email ya registrado (`409`) → colegio ya
        registrado en el municipio (`409`) → alta (`201`). La existencia del email y del colegio
        nunca se consulta antes de superar el límite de intentos y el captcha.

        Límite de intentos: como máximo 5 intentos por IP en cualquier ventana de 15 minutos. Cuentan
        todos los intentos que llegan con un cuerpo JSON válido, también los que usan un email ya
        registrado o los que se rechazan por captcha o validación; el intento rechazado por el límite
        no cuenta. El sexto responde `429` con `Retry-After` sin verificar el captcha, validar la
        entrada ni consultar la base de datos de usuarios y colegios.

        El alta inicia la sesión: la respuesta `201` fija la cookie `refresh_token` y no
        devuelve ningún access token. El cliente lo obtiene a continuación con
        `POST /api/auth/refresh`, que además confirma que el navegador ha aceptado la cookie.
        Las respuestas de error no fijan ninguna cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              schoolName: CEIP Lluís Vives
              municipalityCode: '46250'
              firstName: José María
              lastName: García-López
              email: jose.garcia@example.com
              password: Secreta123!
              captcha:
                version: v3
                token: 03AFcWeA6...
      responses:
        '201':
          description: Colegio y usuario creados, con la sesión iniciada mediante cookie
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                success: true
                data:
                  user:
                    id: 0b8f1e6a-6f4e-4d8a-9a51-2c3f7d9e8b10
                    email: jose.garcia@example.com
                    firstName: José María
                    lastName: García-López
                  school:
                    id: 5d2c9a14-3b7e-4f61-8c0d-9e4a1b2f6c73
                    name: CEIP Lluís Vives
                    municipality:
                      code: '46250'
                      name: València
                      province: Valencia/València
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: |
            El email (`EMAIL_ALREADY_REGISTERED`) o el colegio en ese municipio
            (`SCHOOL_ALREADY_REGISTERED`) ya están registrados; no se crea ni el colegio ni el
            usuario. Si ambos existen, se informa del email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailAlreadyRegistered:
                  summary: Email ya registrado
                  value:
                    success: false
                    error:
                      code: EMAIL_ALREADY_REGISTERED
                      message: El email ya está registrado
                schoolAlreadyRegistered:
                  summary: Colegio ya registrado en el municipio
                  value:
                    success: false
                    error:
                      code: SCHOOL_ALREADY_REGISTERED
                      message: El colegio ya está registrado en ese municipio
        '422':
          description: |
            La verificación de reCAPTCHA no permite procesar el registro. El cliente distingue
            las dos causas por `error.code`: con `CAPTCHA_CHALLENGE_REQUIRED` presenta el reto
            v2; con `CAPTCHA_FAILED` informa de que la verificación ha fallado.

            Un token `v3` se acepta si Google confirma el éxito, la acción es `register`, el
            dominio es el de la aplicación y el score es ≥ 0,6; con un score menor se pide el reto
            v2 (`CAPTCHA_CHALLENGE_REQUIRED`). Un token `v2` se acepta si Google confirma el éxito y
            el dominio. Un `captcha` ausente o mal formado, un token inválido, caducado o ya usado,
            una acción o un dominio incorrectos y un reto no superado responden `CAPTCHA_FAILED`.
            Cada token sirve una sola vez y caduca a los 2 minutos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                challengeRequired:
                  summary: Score de reCAPTCHA v3 menor que 0.6
                  value:
                    success: false
                    error:
                      code: CAPTCHA_CHALLENGE_REQUIRED
                      message: Se requiere completar el reto reCAPTCHA v2
                captchaFailed:
                  summary: Token ausente, inválido o caducado, o reto v2 no superado
                  value:
                    success: false
                    error:
                      code: CAPTCHA_FAILED
                      message: La verificación de reCAPTCHA ha fallado
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Se han superado los 5 intentos de registro por IP en 15 minutos. `Retry-After` indica
            los segundos que faltan para que el intento más antiguo salga de la ventana.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            El servicio no puede procesar el registro: la base de datos no responde
            (`DATABASE_UNAVAILABLE`), la petición supera el timeout de 10 segundos
            (`REQUEST_TIMEOUT`) o no se ha podido verificar el captcha (`CAPTCHA_UNAVAILABLE`:
            Google no responde en 3 segundos, falla o las claves están mal configuradas). Se falla
            cerrado: no se procesa el registro sin verificar el captcha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                databaseUnavailable:
                  summary: Base de datos no disponible
                  value:
                    success: false
                    error:
                      code: DATABASE_UNAVAILABLE
                      message: La base de datos no está disponible
                requestTimeout:
                  summary: Timeout de la petición
                  value:
                    success: false
                    error:
                      code: REQUEST_TIMEOUT
                      message: La petición ha superado el tiempo máximo de respuesta
                captchaUnavailable:
                  summary: No se ha podido verificar el captcha
                  value:
                    success: false
                    error:
                      code: CAPTCHA_UNAVAILABLE
                      message: La verificación de reCAPTCHA no está disponible
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Emite un access token nuevo a partir de la cookie de sesión
      # Público respecto al access token: la credencial es la cookie `refresh_token`.
      security: []
      description: |
        Lee la cookie `refresh_token` y, si el refresh token existe, no está revocado ni
        caducado y su usuario está activo, devuelve un access token JWT de 15 minutos con el
        usuario y su colegio. Es la única operación que emite access tokens. No rota el refresh
        token ni amplía su caducidad (24 horas desde el alta).

        Protección CSRF: la cabecera `Origin` es obligatoria y debe coincidir con el origen
        configurado de la aplicación; si falta o no coincide responde `403 ORIGIN_NOT_ALLOWED`
        sin consultar la base de datos. Cualquier sesión no válida responde `401
        INVALID_SESSION` sin indicar la causa y borra la cookie.
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          description: Refresh token opaco fijado por el registro
          schema:
            type: string
        - in: header
          name: Origin
          required: true
          description: Origen de la aplicación que hace la petición
          schema:
            type: string
      responses:
        '200':
          description: Sesión válida; access token nuevo
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                success: true
                data:
                  session:
                    accessToken: eyJhbGciOiJIUzI1NiJ9...
                    expiresIn: 900
                  user:
                    id: 0b8f1e6a-6f4e-4d8a-9a51-2c3f7d9e8b10
                    email: jose.garcia@example.com
                    firstName: José María
                    lastName: García-López
                    role: ADMIN
                  school:
                    id: 5d2c9a14-3b7e-4f61-8c0d-9e4a1b2f6c73
                    name: CEIP Lluís Vives
        '401':
          description: |
            No hay sesión válida: falta la cookie, el token no existe, está revocado o
            caducado, o el usuario no está activo. La respuesta borra la cookie.
          headers:
            Set-Cookie:
              description: Borra la cookie (`refresh_token=; Path=/api/auth; Max-Age=0`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_SESSION
                  message: La sesión no es válida
        '403':
          description: La cabecera `Origin` falta o no coincide con el origen de la aplicación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: ORIGIN_NOT_ALLOWED
                  message: El origen de la petición no está permitido
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/municipalities:
    get:
      tags: [Municipalities]
      operationId: listMunicipalities
      summary: Lista los municipios de la Comunitat Valenciana
      # Endpoint público: no requiere autenticación.
      security: []
      description: |
        Devuelve todos los municipios de la Comunitat Valenciana, ordenados por nombre. Son datos
        fijos (relación oficial del INE), por lo que la respuesta es cacheable. El formulario de
        registro los usa para elegir el municipio del colegio.
      responses:
        '200':
          description: Lista de municipios
          headers:
            Cache-Control:
              description: La respuesta es pública y cacheable durante un día (`public, max-age=86400`)
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityListResponse'
              example:
                success: true
                data:
                  - code: '03014'
                    name: Alacant/Alicante
                    province: Alicante/Alacant
                  - code: '46250'
                    name: València
                    province: Valencia/València
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, database]
          additionalProperties: false
          properties:
            status:
              type: string
              const: ok
            database:
              type: string
              const: up
    MunicipalityListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Municipality'
    ErrorCode:
      type: string
      description: Código de error estable que el frontend traduce por i18n
      enum:
        - NOT_FOUND
        - INVALID_JSON
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - REQUEST_TIMEOUT
        - DATABASE_UNAVAILABLE
        - VALIDATION_ERROR
        - EMAIL_ALREADY_REGISTERED
        - SCHOOL_ALREADY_REGISTERED
        - CAPTCHA_CHALLENGE_REQUIRED
        - CAPTCHA_FAILED
        - TOO_MANY_REQUESTS
        - INVALID_SESSION
        - ORIGIN_NOT_ALLOWED
        - CAPTCHA_UNAVAILABLE
    ErrorResponse:
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Descripción en castellano para desarrolladores; no se muestra al usuario
            details:
              type: array
              description: Información adicional opcional (p. ej. errores de validación por campo)
              items: {}
    FieldErrorCode:
      type: string
      description: |
        Motivo por el que un campo no es válido. Códigos genéricos, reutilizables entre
        historias; el frontend traduce la pareja campo-código por i18n.
      enum:
        - REQUIRED
        - INVALID_LENGTH
        - INVALID_FORMAT
        - INVALID_CHARACTERS
        - WEAK_PASSWORD
    FieldError:
      type: object
      required: [field, code]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Nombre de la propiedad del cuerpo de la petición que no es válida
        code:
          $ref: '#/components/schemas/FieldErrorCode'
    ValidationErrorResponse:
      # Esquema independiente y no `allOf` sobre ErrorResponse: con `additionalProperties: false`
      # en `error`, la composición rechazaría el `details` redefinido (design.md D1).
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Descripción en castellano para desarrolladores; no se muestra al usuario
            details:
              type: array
              description: Un elemento por cada campo no válido (solo con `VALIDATION_ERROR`)
              items:
                $ref: '#/components/schemas/FieldError'
    CaptchaToken:
      type: object
      description: |
        Token de reCAPTCHA y versión con la que se obtuvo; cada versión se verifica con una
        clave secreta distinta.
      required: [version, token]
      additionalProperties: false
      properties:
        version:
          type: string
          enum: [v3, v2]
        token:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      description: |
        Datos del registro. Solo se declaran las longitudes máximas: las reglas completas de
        cada campo (caracteres permitidos, longitudes mínimas, formato del email y variedad de
        la contraseña) las valida el backend y se describen en la historia US01. Las propiedades
        que no figuran en este esquema se ignoran.
      required: [schoolName, municipalityCode, firstName, lastName, email, password, captcha]
      properties:
        schoolName:
          type: string
          maxLength: 150
        municipalityCode:
          type: string
          pattern: '^\d{5}$'
          description: |
            Código INE del municipio del colegio (2 dígitos de provincia y 3 de municipio),
            tomado de `GET /api/municipalities`.
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 72
          description: |
            De 8 caracteres a 72 bytes en UTF-8: Bcrypt ignora el resto, así que se rechaza en
            lugar de truncarla. Las letras con acento y los símbolos fuera de ASCII ocupan 2 bytes
            o más, por lo que el límite en caracteres puede ser menor que 72.
        captcha:
          $ref: '#/components/schemas/CaptchaToken'
    RegisteredUser:
      type: object
      required: [id, email, firstName, lastName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Email normalizado (sin espacios al inicio ni al final y en minúsculas)
        firstName:
          type: string
        lastName:
          type: string
    Municipality:
      type: object
      required: [code, name, province]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^\d{5}$'
          description: Código INE (2 dígitos de provincia y 3 de municipio)
        name:
          type: string
          description: Nombre oficial, que puede tener dos formas (p. ej. «Alacant/Alicante»)
        province:
          type: string
    RegisteredSchool:
      type: object
      required: [id, name, municipality]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        municipality:
          $ref: '#/components/schemas/Municipality'
    RegisterResponse:
      type: object
      description: Respuesta del alta; nunca incluye la contraseña ni su hash
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, school]
          additionalProperties: false
          properties:
            user:
              $ref: '#/components/schemas/RegisteredUser'
            school:
              $ref: '#/components/schemas/RegisteredSchool'
    Session:
      type: object
      description: Access token en memoria del cliente; nunca se persiste en el navegador
      required: [accessToken, expiresIn]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT HS256 con `sub` (id del usuario), `schoolId` y `role`
        expiresIn:
          type: integer
          description: Segundos de validez del access token
          const: 900
    SessionUser:
      type: object
      required: [id, email, firstName, lastName, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
    SessionSchool:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SessionResponse:
      type: object
      description: Sesión renovada; nunca incluye el refresh token ni su hash
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [session, user, school]
          additionalProperties: false
          properties:
            session:
              $ref: '#/components/schemas/Session'
            user:
              $ref: '#/components/schemas/SessionUser'
            school:
              $ref: '#/components/schemas/SessionSchool'
  headers:
    RefreshTokenCookie:
      description: |
        Cookie de sesión con el refresh token opaco:
        `refresh_token=<token>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth; Max-Age=86400`.
        No es legible desde JavaScript y solo se envía a `/api/auth`.
      required: true
      schema:
        type: string
    NoStore:
      description: La respuesta contiene credenciales y no se almacena en caché (`no-store`)
      required: true
      schema:
        type: string
        const: no-store
  responses:
    InvalidJson:
      description: El cuerpo de la petición no es JSON válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_JSON
              message: El cuerpo de la petición no es JSON válido
    PayloadTooLarge:
      description: El cuerpo de la petición supera el límite de 100 KB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: PAYLOAD_TOO_LARGE
              message: El cuerpo de la petición supera el tamaño máximo permitido
    UnsupportedMediaType:
      description: El `charset` o el `Content-Encoding` del cuerpo no está soportado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: La codificación del cuerpo de la petición no está soportada
    NotFound:
      description: La ruta no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: La ruta solicitada no existe
    InternalError:
      description: Error no controlado; la traza solo se registra en el log
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Error interno del servidor
    ServiceUnavailable:
      description: |
        Servicio no disponible: la base de datos no responde (`DATABASE_UNAVAILABLE`) o la
        petición ha superado el timeout de 10 segundos (`REQUEST_TIMEOUT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            databaseUnavailable:
              summary: Base de datos no disponible
              value:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: La base de datos no está disponible
            requestTimeout:
              summary: Timeout de la petición
              value:
                success: false
                error:
                  code: REQUEST_TIMEOUT
                  message: La petición ha superado el tiempo máximo de respuesta
    ValidationError:
      description: |
        La entrada no es válida (`VALIDATION_ERROR`), con un elemento en `details` por cada
        campo no válido. El cuerpo JSON mal formado (`INVALID_JSON`) también responde `400`
        con este mismo formato, sin `details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            validationError:
              summary: Campos no válidos
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: La petición contiene campos no válidos
                  details:
                    - field: email
                      code: INVALID_FORMAT
                    - field: password
                      code: INVALID_LENGTH
            invalidJson:
              summary: Cuerpo JSON mal formado
              value:
                success: false
                error:
                  code: INVALID_JSON
                  message: El cuerpo de la petición no es JSON válido
    TooManyRequests:
      description: Se ha superado el límite de peticiones; `Retry-After` indica cuándo reintentar
      headers:
        Retry-After:
          description: Segundos que faltan para poder reintentar
          required: true
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: TOO_MANY_REQUESTS
              message: Se ha superado el número máximo de intentos
