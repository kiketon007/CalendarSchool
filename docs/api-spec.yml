              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfessorResponse'
              example:
                success: true
                data:
                  professor:
                    id: 0192f5a0-0000-7000-8000-0000000000f1
                    firstName: José María
                    lastName: García López
                    position: DIRECTOR
                    subjects: []
                    tutoredClass:
                      id: 0192f5a0-0000-7000-8000-0000000000e2
                      name: A
                      courseId: 0192f5a0-0000-7000-8000-0000000000d2
                      courseName: 2º Primaria
                  replacedTutor:
                    id: 0192f5a0-0000-7000-8000-0000000000f2
                    firstName: Luis
                    lastName: Pérez
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProfessorNotFound'
        '409':
          description: |
            `PROFESSOR_ALREADY_TUTOR`: otra escritura asignó al profesor a una clase a la vez (la edición
            de un curso, o de otro profesor) y esta no pudo completarse. No se guarda nada; se puede
            reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: PROFESSOR_ALREADY_TUTOR
                  message: El profesor ya tutoriza otra clase
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Professors]
      operationId: deleteProfessor
      summary: Borra un profesor del colegio
      security:
        - bearerAuth: []
      description: |
        Borra de verdad, en una única transacción, al profesor del colegio de la persona que hace la
        petición; no hay papelera ni se puede deshacer. Si tutorizaba una clase, esta queda sin tutor (la
        clave ajena `classes.tutor_id` es `ON DELETE SET NULL`) y sigue existiendo sin más cambios.
        Disponible para los roles `ADMIN` y `MEMBER`; se autentica con el access token y no exige la
        cabecera `Origin`. La petición no lleva cuerpo. La fila del profesor queda bloqueada mientras se
        lee su clase y se borra, así que una edición simultánea (`PUT`) espera y, si se procesa después,
        recibe `404`; de dos borrados simultáneos, uno responde `200` y el otro `404`.

        La respuesta dice la clase que se liberó de verdad (`freedClass`), leída en la misma transacción.
        Un profesor de otro colegio, inexistente, ya borrado o con un identificador que no es un UUID
        responde `404` sin distinguir el caso.
      responses:
        '200':
          description: Profesor borrado; la clase que se quedó sin tutor, si tenía
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProfessorResponse'
              example:
                success: true
                data:
                  deleted:
                    freedClass:
                      id: 0192f5a0-0000-7000-8000-0000000000e1
                      name: A
                      courseName: 1º Primaria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProfessorNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/calendars:
    post:
      tags: [Calendars]
      operationId: createCalendar
      summary: Crea un calendario base del colegio
      security:
        - bearerAuth: []
      description: |
        Crea un calendario base de la jornada del colegio de la persona que hace la petición: su
        nombre, sus periodos (sesiones y recreos, con su hora de inicio y de fin, iguales de lunes a
        viernes) y los cursos que lo siguen, en una única transacción: o se crea todo o no se crea
        nada. **Solo para el rol `ADMIN`**: un `MEMBER` recibe `403 FORBIDDEN` sin que se valide el
        cuerpo ni se cree nada. Se autentica con el access token y no exige la cabecera `Origin`. El
        colegio sale siempre de la sesión: el cuerpo no puede indicarlo.

        **Periodos.** Una lista ordenada por hora, de 1 a 8 sesiones (`SESSION`) y de 0 a 2 recreos
        (`BREAK`). Un recreo va entre dos sesiones (ni el primero, ni el último, ni junto a otro). Cada
        periodo acaba después de empezar, dura como máximo 90 minutos y no empieza antes de que acabe
        el anterior (pueden ser contiguos o dejar un hueco). Las horas son `HH:MM` de 24 horas, de
        `00:00` a `23:59`. El número de una sesión no se guarda: es su orden entre las sesiones.

        **Cursos.** `courseIds` es opcional y sin repetidos. Cada curso debe ser del colegio: uno de
        otro colegio o que no existe es un `400` con `NOT_FOUND` en `courseIds[<i>]`. Un curso sigue
        como mucho un calendario: si ya seguía otro, pasa a este en la misma transacción. Los cursos
        se bloquean en orden de `id`, así que dos altas con cursos en común no se interbloquean.

        Errores de campo (`400`), en el orden del cuerpo: `name` (`REQUIRED`, `INVALID_LENGTH`,
        `INVALID_CHARACTERS`), `periods` (`REQUIRED` sin ninguna sesión, `INVALID_LENGTH` con más de 8
        sesiones o más de 2 recreos), `periods[<i>].type` (`REQUIRED`, `INVALID_FORMAT`, o
        `NOT_ALLOWED` para un recreo mal colocado), `periods[<i>].startTime` y `periods[<i>].endTime`
        (`REQUIRED`, `INVALID_FORMAT`, y además `OVERLAP` en el inicio, `INVALID_RANGE` y `TOO_LONG`
        en el final) y `courseIds[<i>]` (`INVALID_FORMAT`, `DUPLICATE`, `NOT_FOUND`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarRequest'
            example:
              name: Primaria
              periods:
                - { type: SESSION, startTime: '09:00', endTime: '09:45' }
                - { type: SESSION, startTime: '09:45', endTime: '10:30' }
                - { type: SESSION, startTime: '10:30', endTime: '11:15' }
                - { type: BREAK, startTime: '11:15', endTime: '11:45' }
                - { type: SESSION, startTime: '11:45', endTime: '12:30' }
                - { type: SESSION, startTime: '12:30', endTime: '13:15' }
                - { type: SESSION, startTime: '13:15', endTime: '14:00' }
              courseIds:
                - 0192f5a0-0000-7000-8000-0000000000d1
      responses:
        '201':
          description: Calendario creado, con sus periodos en orden y sus cursos
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              example:
                success: true
                data:
                  calendar:
                    id: 0192f5a0-0000-7000-8000-0000000000c1
                    name: Primaria
                    createdAt: '2026-10-23T09:30:00.000Z'
                    periods:
                      - { type: SESSION, startTime: '09:00', endTime: '09:45' }
                      - { type: SESSION, startTime: '09:45', endTime: '10:30' }
                      - { type: SESSION, startTime: '10:30', endTime: '11:15' }
                      - { type: BREAK, startTime: '11:15', endTime: '11:45' }
                      - { type: SESSION, startTime: '11:45', endTime: '12:30' }
                      - { type: SESSION, startTime: '12:30', endTime: '13:15' }
                      - { type: SESSION, startTime: '13:15', endTime: '14:00' }
                    courses:
                      - id: 0192f5a0-0000-7000-8000-0000000000d1
                        name: 1º Primaria
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Ya existe en el colegio un calendario con ese nombre (`CALENDAR_ALREADY_EXISTS`), sin
            distinguir mayúsculas ni espacios sobrantes. No se crea nada. Otro colegio sí puede tener
            un calendario con el mismo nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: CALENDAR_ALREADY_EXISTS
                  message: Ya existe un calendario con ese nombre en el colegio
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Calendars]
      operationId: listCalendars
      summary: Lista los calendarios del colegio
      security:
        - bearerAuth: []
      description: |
        Devuelve los calendarios del colegio de la persona que hace la petición, y solo esos, cada uno
        con sus periodos en orden y los cursos que lo siguen. Disponible para los roles `ADMIN` y
        `MEMBER`. Ordenados por nombre y, los cursos, en orden natural («2º» antes que «10º»), ambos
        sin distinguir mayúsculas ni acentos. No admite paginación ni filtros: cualquier parámetro
        se ignora.
      responses:
        '200':
          description: Calendarios del colegio (una lista vacía si no tiene ninguno)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarListResponse'
              example:
                success: true
                data:
                  calendars:
                    - id: 0192f5a0-0000-7000-8000-0000000000c1
                      name: Primaria
                      createdAt: '2026-10-23T09:30:00.000Z'
                      periods:
                        - { type: SESSION, startTime: '09:00', endTime: '09:45' }
                        - { type: BREAK, startTime: '09:45', endTime: '10:15' }
                        - { type: SESSION, startTime: '10:15', endTime: '11:00' }
                      courses: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/calendars/{id}:
    parameters:
      - $ref: '#/components/parameters/CalendarId'
    get:
      tags: [Calendars]
      operationId: getCalendar
      summary: Devuelve un calendario del colegio
      security:
        - bearerAuth: []
      description: |
        Devuelve el calendario con ese identificador si es del colegio de la persona que hace la
        petición, con sus periodos en orden y los cursos que lo siguen. Disponible para los roles
        `ADMIN` y `MEMBER`. Un calendario de otro colegio, inexistente o con un identificador que no es
        un UUID responde `404` sin distinguir el caso.
      responses:
        '200':
          description: El calendario
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              example:
                success: true
                data:
                  calendar:
                    id: 0192f5a0-0000-7000-8000-0000000000c1
                    name: Primaria
                    createdAt: '2026-10-23T09:30:00.000Z'
                    periods:
                      - { type: SESSION, startTime: '09:00', endTime: '09:45' }
                      - { type: BREAK, startTime: '09:45', endTime: '10:15' }
                      - { type: SESSION, startTime: '10:15', endTime: '11:00' }
                    courses:
                      - id: 0192f5a0-0000-7000-8000-0000000000d1
                        name: 1º Primaria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CalendarNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Calendars]
      operationId: updateCalendar
      summary: Edita un calendario base del colegio
      security:
        - bearerAuth: []
      description: |
        Guarda el **estado final** del calendario (nombre, periodos y cursos) en una única transacción:
        o se guarda todo o no se guarda nada. **Solo para el rol `ADMIN`**: un `MEMBER` recibe
        `403 FORBIDDEN` antes de que se lea el identificador o se valide el cuerpo, también con un
        calendario inexistente. Se autentica con el access token y no exige la cabecera `Origin`. El
        colegio sale siempre de la sesión. Un calendario de otro colegio, inexistente o con un
        identificador que no es un UUID responde `404` sin cambiar nada. Gana el último guardado: no
        hay control de versión.

        **Reglas.** Las mismas que `POST /api/calendars` (nombre, periodos y `courseIds`, con los mismos
        errores de campo y en el mismo orden). Los periodos se **reemplazan** enteros, en el orden
        recibido. Renombrarlo al nombre de otro calendario del colegio es un `409`; cambiar solo
        mayúsculas o espacios del propio nombre es válido.

        **Cursos.** Los de `courseIds` pasan a seguir este calendario (también los que seguían otro);
        los que lo seguían y ya no están, y todos si falta `courseIds`, quedan **sin calendario**.
        Un curso de otro colegio o inexistente es un `400` con `NOT_FOUND` en `courseIds[<i>]`. La
        edición bloquea el calendario y después los cursos en orden de `id`, así que no se interbloquea
        con las altas, con otras ediciones ni con el borrado de un curso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCalendarRequest'
            example:
              name: Primaria 1º ciclo
              periods:
                - { type: SESSION, startTime: '09:00', endTime: '09:45' }
                - { type: SESSION, startTime: '09:45', endTime: '10:30' }
                - { type: BREAK, startTime: '10:30', endTime: '11:00' }
                - { type: SESSION, startTime: '11:00', endTime: '11:45' }
              courseIds:
                - 0192f5a0-0000-7000-8000-0000000000d1
      responses:
        '200':
          description: Calendario guardado, con sus periodos en orden y sus cursos
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              example:
                success: true
                data:
                  calendar:
                    id: 0192f5a0-0000-7000-8000-0000000000c1
                    name: Primaria 1º ciclo
                    createdAt: '2026-10-23T09:30:00.000Z'
                    periods:
                      - { type: SESSION, startTime: '09:00', endTime: '09:45' }
                      - { type: SESSION, startTime: '09:45', endTime: '10:30' }
                      - { type: BREAK, startTime: '10:30', endTime: '11:00' }
                      - { type: SESSION, startTime: '11:00', endTime: '11:45' }
                    courses:
                      - id: 0192f5a0-0000-7000-8000-0000000000d1
                        name: 1º Primaria
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CalendarNotFound'
        '409':
          description: |
            Otro calendario del colegio ya usa ese nombre (`CALENDAR_ALREADY_EXISTS`), sin distinguir
            mayúsculas ni espacios sobrantes. No se cambia nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: CALENDAR_ALREADY_EXISTS
                  message: Ya existe un calendario con ese nombre en el colegio
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CalendarId:
      name: id
      in: path
      required: true
      description: |
        Identificador del calendario. Un valor que no es un UUID se trata como un calendario inexistente
        (`404`), igual que el de otro colegio.
      schema:
        type: string
    ProfessorId:
      name: id
      in: path
      required: true
      description: |
        Identificador del profesor. Un valor que no es un UUID se trata como un profesor inexistente
        (`404`), igual que el de otro colegio.
      schema:
        type: string
    StudentId:
      name: id
      in: path
      required: true
      description: |
        Identificador del alumno. Un valor que no es un UUID se trata como un alumno inexistente
        (`404`), igual que el de otro colegio.
      schema:
        type: string
    CourseId:
      name: id
      in: path
      required: true
      description: |
        Identificador del curso. Un valor que no es un UUID se trata como un curso inexistente
        (`404`), igual que el de otro colegio.
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: |
        Identificador del usuario. Un valor que no es un UUID se trata como un usuario inexistente
        (`404`), igual que el de otro colegio.
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      description: |
        Identificador de la invitación. Un valor que no es un UUID se trata como una invitación
        inexistente (`404`), igual que la de otro colegio.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT de 15 minutos que emite `POST /api/auth/refresh`. Además de la firma y la
        caducidad, el servidor comprueba en cada petición que su sesión siga vigente.
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [status, database]
          additionalProperties: false
          properties:
            status:
              type: string
              const: ok
            database:
              type: string
              const: up
    MunicipalityListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Municipality'
    SchoolUser:
      type: object
      description: Usuario de un colegio; nunca incluye el hash de la contraseña ni datos de consentimiento
      required: [id, firstName, lastName, email, role, status, passwordResetPending, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
        status:
          type: string
          description: Los usuarios `DELETED` no se devuelven
          enum: [ACTIVE, SUSPENDED]
        passwordResetPending:
          type: boolean
          description: |
            `true` si el usuario tiene un enlace de restablecimiento de contraseña pendiente (no
            usado, no revocado y no caducado)
        createdAt:
          type: string
          format: date-time
    SchoolUserListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SchoolUser'
    ChangeUserRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [ADMIN, MEMBER]
    SchoolUserResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SchoolUser'
    CreateInvitationRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          description: Rol que tendrá la persona que acepte la invitación
          enum: [ADMIN, MEMBER]
    Invitation:
      type: object
      description: Invitación pendiente; nunca incluye el token, su hash ni el enlace
      required: [id, role, createdBy, createdAt, expiresAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, MEMBER]
        createdBy:
          type: object
          description: Administrador que generó la invitación (puede estar dado de baja)
          required: [id, firstName, lastName]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Instante de creación más 72 horas
    InvitationCreatedResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [invitation, url]
          additionalProperties: false
          properties:
            invitation:
              $ref: '#/components/schemas/Invitation'
            url:
              type: string
              description: |
                Enlace completo (`<origen>/invitacion#<token>`). Solo se devuelve en esta respuesta.
    InvitationListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    CreateCourseRequest:
      type: object
      required: [name, classes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Nombre del curso (1 a 100 caracteres tras recortar): letras, dígitos, `º`, `ª`, `-`, `/` y
            espacios. Único en el colegio sin distinguir mayúsculas ni espacios sobrantes
        classes:
          type: array
          description: Clases del curso, de 1 a 12
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/CreateClassRequest'
    CreateClassRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Nombre de la clase (1 a 10 caracteres tras recortar): letras, dígitos, `º`, `ª`, `-` y
            espacios. Único dentro del curso sin distinguir mayúsculas ni espacios sobrantes
    UpdateCourseRequest:
      type: object
      required: [name, classes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Nombre del curso (1 a 100 caracteres tras recortar): letras, dígitos, `º`, `ª`, `-`, `/` y
            espacios. Único en el colegio sin distinguir mayúsculas ni espacios sobrantes; el propio
            curso no cuenta
        classes:
          type: array
          description: |
            Estado final de las clases del curso, de 1 a 12. Las que llevan `id` se conservan
            (renombradas si cambia el nombre), las que no lo llevan se crean y las ausentes se borran
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/UpdateClassRequest'
    UpdateClassRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: |
            Identificador de una clase que ya tiene el curso. Sin él, la clase es nueva. No puede
            repetirse en el cuerpo
        name:
          type: string
          description: |
            Nombre de la clase (1 a 10 caracteres tras recortar): letras, dígitos, `º`, `ª`, `-` y
            espacios. Único dentro del curso sin distinguir mayúsculas ni espacios sobrantes
        tutorId:
          description: |
            El profesor que tutoriza la clase. Omitido, el tutor no cambia (una clase nueva nace sin
            tutor); `null`, la clase queda sin tutor; un UUID, ese profesor pasa a ser su tutor. Debe ser
            de un profesor del colegio y no puede repetirse en el cuerpo
          anyOf:
            - type: 'null'
            - type: string
              format: uuid
    TutorSummary:
      type: object
      description: El profesor que tutoriza una clase, con lo mínimo para mostrarlo
      required: [id, firstName, lastName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
    ProfessorPosition:
      type: string
      description: |
        Cargo del profesor. Es un dato informativo y no concede permisos en la aplicación
      enum: [DIRECTOR, JEFE_ESTUDIOS]
    StudentReference:
      type: object
      description: Un curso o una clase, con su nombre
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateStudentRequest:
      type: object
      required: [firstName, lastName, courseId, cafeteria]
      additionalProperties: false
      properties:
        firstName:
          type: string
          description: |
            Nombre (1 a 100 caracteres tras recortar): letras con acentos, dígitos, `·`, espacios,
            apóstrofo y guion
        lastName:
          type: string
          description: Apellido, con las mismas reglas que el nombre
        courseId:
          type: string
          format: uuid
          description: Curso del alumno (de un curso del colegio)
        classId:
          description: |
            Clase del alumno, que debe ser del curso `courseId`; si falta o es `null`, el alumno queda
            en el curso sin clase
          anyOf:
            - type: 'null'
            - type: string
              format: uuid
        cafeteria:
          type: boolean
          description: Si el alumno come en el comedor
        scholarship:
          description: |
            Si tiene beca de comedor. Obligatorio con `cafeteria: true`; con `cafeteria: false` no se
            admite (`400` con `NOT_ALLOWED`)
          anyOf:
            - type: 'null'
            - type: boolean
        foodType:
          description: |
            Tipo de comida (hasta 255 caracteres), p. ej. «Vegetariana». Dato sensible. Solo con
            `cafeteria: true` (si no, `400` con `NOT_ALLOWED`); vacío equivale a `null`
          anyOf:
            - type: 'null'
            - type: string
        observations:
          description: |
            Observaciones (hasta 5000 caracteres, con saltos de línea). Dato sensible; vacío equivale
            a `null`
          anyOf:
            - type: 'null'
            - type: string
    UpdateStudentRequest:
      description: |
        Estado final de un alumno: los mismos campos y reglas que `CreateStudentRequest`. Lo que falta o
        es `null` (`classId`, `foodType`, `observations`) deja el campo vacío.
      allOf:
        - $ref: '#/components/schemas/CreateStudentRequest'
    StudentSummary:
      type: object
      description: |
        Alumno de un colegio tal como lo muestra el listado: sin los datos sensibles (`foodType` y
        `observations`)
      required: [id, firstName, lastName, course, class, cafeteria, scholarship]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        course:
          description: Curso del alumno, o `null` si el curso se borró
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/StudentReference'
        class:
          description: Clase del alumno, o `null` si no tiene (o se quitó o se borró su curso)
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/StudentReference'
        cafeteria:
          type: boolean
        scholarship:
          description: Si tiene beca de comedor, o `null` si no come en el comedor
          anyOf:
            - type: 'null'
            - type: boolean
    Student:
      type: object
      description: Alumno de un colegio con todos sus datos, incluidos los sensibles
      required: [id, firstName, lastName, course, class, cafeteria, scholarship, foodType, observations]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        course:
          description: Curso del alumno, o `null` si el curso se borró
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/StudentReference'
        class:
          description: Clase del alumno, o `null` si no tiene (o se quitó o se borró su curso)
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/StudentReference'
        cafeteria:
          type: boolean
        scholarship:
          description: Si tiene beca de comedor, o `null` si no come en el comedor
          anyOf:
            - type: 'null'
            - type: boolean
        foodType:
          description: Tipo de comida, o `null`. Dato sensible
          anyOf:
            - type: 'null'
            - type: string
        observations:
          description: Observaciones, o `null`. Dato sensible
          anyOf:
            - type: 'null'
            - type: string
    StudentResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [student]
          additionalProperties: false
          properties:
            student:
              $ref: '#/components/schemas/Student'
    DeleteStudentResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                  description: Identificador del alumno borrado
    StudentListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [students]
          additionalProperties: false
          properties:
            students:
              type: array
              items:
                $ref: '#/components/schemas/StudentSummary'
    CreateProfessorRequest:
      type: object
      required: [firstName, lastName]
      additionalProperties: false
      properties:
        firstName:
          type: string
          description: |
            Nombre (1 a 100 caracteres tras recortar): letras con acentos, dígitos, `·`, espacios,
            apóstrofo y guion
        lastName:
          type: string
          description: Apellido, con las mismas reglas que el nombre
        position:
          description: Cargo del profesor; si falta o es `null`, no tiene cargo
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProfessorPosition'
        classId:
          description: |
            Clase que tutorizará (de un curso del colegio y sin tutor); si falta o es `null`, el profesor
            se crea sin clase
          anyOf:
            - type: 'null'
            - type: string
              format: uuid
    UpdateProfessorRequest:
      type: object
      required: [firstName, lastName]
      additionalProperties: false
      properties:
        firstName:
          type: string
          description: Nombre, con las mismas reglas que en `CreateProfessorRequest`
        lastName:
          type: string
          description: Apellido, con las mismas reglas que el nombre
        position:
          description: Cargo del profesor; si falta o es `null`, queda sin cargo
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProfessorPosition'
        classId:
          description: |
            Clase que tutorizará, de un curso del colegio (aunque tenga otro tutor, que la perderá).
            Si falta, no se toca la tutoría; con `null`, el profesor queda sin clase.
          anyOf:
            - type: 'null'
            - type: string
              format: uuid
    TutoredClass:
      type: object
      description: La clase que tutoriza un profesor, con el curso al que pertenece
      required: [id, name, courseId, courseName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        courseId:
          type: string
          format: uuid
        courseName:
          type: string
    Professor:
      type: object
      description: Profesor de un colegio
      required: [id, firstName, lastName, position, subjects, tutoredClass]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        position:
          description: Cargo, o `null` si no tiene
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProfessorPosition'
        subjects:
          type: array
          description: |
            Asignaturas que imparte. Siempre `[]` hasta que existan las asignaturas y su asignación
            (`US-PROF-ASSIGN`), que concretará los elementos
          items:
            type: object
        tutoredClass:
          description: Clase que tutoriza, o `null` si no tutoriza ninguna
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/TutoredClass'
    ProfessorResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [professor]
          additionalProperties: false
          properties:
            professor:
              $ref: '#/components/schemas/Professor'
    UpdateProfessorResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [professor, replacedTutor]
          additionalProperties: false
          properties:
            professor:
              $ref: '#/components/schemas/Professor'
            replacedTutor:
              description: |
                El profesor que perdió la tutoría de la clase elegida, o `null` si esa clase estaba libre
                o la tutoría no cambió
              anyOf:
                - type: 'null'
                - $ref: '#/components/schemas/TutorSummary'
    DeleteProfessorResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              type: object
              required: [freedClass]
              additionalProperties: false
              properties:
                freedClass:
                  description: |
                    La clase que tutorizaba el profesor y que ha quedado sin tutor, o `null` si no
                    tutorizaba ninguna
                  anyOf:
                    - type: 'null'
                    - type: object
                      required: [id, name, courseName]
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        courseName:
                          type: string
    ProfessorListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [professors]
          additionalProperties: false
          properties:
            professors:
              type: array
              items:
                $ref: '#/components/schemas/Professor'
    SchoolClass:
      type: object
      description: Clase de un curso
      required: [id, name, tutor, studentCount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tutor:
          description: Profesor que tutoriza la clase, o `null` si no tiene tutor
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/TutorSummary'
        studentCount:
          type: integer
          minimum: 0
          description: Número de alumnos asignados a esta clase
    Course:
      type: object
      description: Curso de un colegio con sus clases
      required: [id, name, createdAt, classes, studentCount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Instante en que se creó el curso (el que guarda la base de datos)
        classes:
          type: array
          items:
            $ref: '#/components/schemas/SchoolClass'
        studentCount:
          type: integer
          minimum: 0
          description: |
            Número de alumnos del curso, con y sin clase. Los que no tienen clase son la diferencia
            entre este número y la suma de los `studentCount` de sus clases.
    CourseImpact:
      type: object
      description: Lo que se pierde (o se ha perdido) al borrar un curso
      required: [classCount, studentCount]
      additionalProperties: false
      properties:
        classCount:
          type: integer
          minimum: 0
          description: Número de clases del curso, que se borran con él
        studentCount:
          type: integer
          minimum: 0
          description: |
            Número de alumnos del curso, con y sin clase. No se borran: quedan sin curso ni clase
    CourseImpactResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [impact]
          additionalProperties: false
          properties:
            impact:
              $ref: '#/components/schemas/CourseImpact'
    CourseDeletedResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [deleted]
          additionalProperties: false
          properties:
            deleted:
              $ref: '#/components/schemas/CourseImpact'
    CourseResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [course]
          additionalProperties: false
          properties:
            course:
              $ref: '#/components/schemas/Course'
    CourseCreatedResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [course]
          additionalProperties: false
          properties:
            course:
              $ref: '#/components/schemas/Course'
    CourseListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [courses]
          additionalProperties: false
          properties:
            courses:
              type: array
              items:
                $ref: '#/components/schemas/Course'
    CalendarPeriod:
      type: object
      description: Un periodo de la jornada, igual de lunes a viernes
      required: [type, startTime, endTime]
      additionalProperties: false
      properties:
        type:
          type: string
          description: |
            `SESSION` es una sesión lectiva (su número es su orden entre las sesiones) y `BREAK`, un
            recreo o patio, que no se rellena con ninguna asignatura
          enum: [SESSION, BREAK]
        startTime:
          type: string
          description: Hora de inicio, `HH:MM` de 24 horas (de `00:00` a `23:59`)
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: string
          description: |
            Hora de fin, `HH:MM` de 24 horas, posterior a la de inicio y como mucho 90 minutos después
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    CreateCalendarRequest:
      type: object
      required: [name, periods]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Nombre del calendario (1 a 100 caracteres tras recortar): letras, dígitos, `º`, `ª`, `-`,
            `/` y espacios. Único en el colegio sin distinguir mayúsculas ni espacios sobrantes
        periods:
          type: array
          description: |
            Periodos ordenados por hora: de 1 a 8 sesiones y de 0 a 2 recreos entre dos sesiones. Se
            admite un máximo de 10 elementos
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalendarPeriod'
        courseIds:
          type: array
          description: |
            Cursos del colegio que siguen este calendario, sin repetidos (como mucho 100). Un curso que
            ya seguía otro calendario pasa a este
          maxItems: 100
          items:
            type: string
            format: uuid
    UpdateCalendarRequest:
      type: object
      required: [name, periods]
      description: |
        Estado final del calendario: la misma forma y las mismas reglas que `CreateCalendarRequest`.
        Si falta `courseIds`, el calendario se queda sin cursos
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Nombre del calendario (1 a 100 caracteres tras recortar): letras, dígitos, `º`, `ª`, `-`,
            `/` y espacios. Único en el colegio sin distinguir mayúsculas ni espacios sobrantes
        periods:
          type: array
          description: |
            Periodos ordenados por hora: de 1 a 8 sesiones y de 0 a 2 recreos entre dos sesiones. Se
            admite un máximo de 10 elementos
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CalendarPeriod'
        courseIds:
          type: array
          description: |
            Cursos del colegio que siguen este calendario, sin repetidos (como mucho 100). Un curso que
            ya seguía otro calendario pasa a este
          maxItems: 100
          items:
            type: string
            format: uuid
    Calendar:
      type: object
      required: [id, name, periods, courses, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        periods:
          type: array
          description: Periodos en el orden del día
          items:
            $ref: '#/components/schemas/CalendarPeriod'
        courses:
          type: array
          description: Cursos que siguen este calendario, en orden natural
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        createdAt:
          type: string
          format: date-time
    CalendarResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [calendar]
          additionalProperties: false
          properties:
            calendar:
              $ref: '#/components/schemas/Calendar'
    CalendarListResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [calendars]
          additionalProperties: false
          properties:
            calendars:
              type: array
              items:
                $ref: '#/components/schemas/Calendar'
    ErrorCode:
      type: string
      description: Código de error estable que el frontend traduce por i18n
      enum:
        - NOT_FOUND
        - INVALID_JSON
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - REQUEST_TIMEOUT
        - DATABASE_UNAVAILABLE
        - VALIDATION_ERROR
        - EMAIL_ALREADY_REGISTERED
        - SCHOOL_ALREADY_REGISTERED
        - CAPTCHA_CHALLENGE_REQUIRED
        - CAPTCHA_FAILED
        - TOO_MANY_REQUESTS
        - INVALID_SESSION
        - ORIGIN_NOT_ALLOWED
        - CAPTCHA_UNAVAILABLE
        - INVALID_CREDENTIALS
        - ACCOUNT_SUSPENDED
        - FORBIDDEN
        - LAST_ADMIN_REQUIRED
        - CANNOT_SUSPEND_SELF
        - USER_NOT_ACTIVE
        - ACCESS_LINK_INVALID
        - COURSE_ALREADY_EXISTS
        - COURSE_CHANGED
        - CLASS_ALREADY_HAS_TUTOR
        - PROFESSOR_ALREADY_TUTOR
        - CALENDAR_ALREADY_EXISTS
    ErrorResponse:
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Descripción en castellano para desarrolladores; no se muestra al usuario
            details:
              type: array
              description: Información adicional opcional (p. ej. errores de validación por campo)
              items: {}
    FieldErrorCode:
      type: string
      description: |
        Motivo por el que un campo no es válido. Códigos genéricos, reutilizables entre
        historias; el frontend traduce la pareja campo-código por i18n. `NOT_ALLOWED` es un campo que no
        se admite por el valor de otro (la beca de un alumno que no come en el comedor). `INVALID_RANGE`
        es un intervalo cuyo final no es posterior a su inicio, `TOO_LONG` uno que supera la duración
        máxima y `OVERLAP` uno que empieza antes de que acabe el anterior (los periodos de un
        calendario).
      enum:
        - REQUIRED
        - INVALID_LENGTH
        - INVALID_FORMAT
        - INVALID_CHARACTERS
        - WEAK_PASSWORD
        - DUPLICATE
        - NOT_FOUND
        - NOT_ALLOWED
        - INVALID_RANGE
        - TOO_LONG
        - OVERLAP
    FieldError:
      type: object
      required: [field, code]
      additionalProperties: false
      properties:
        field:
          type: string
          description: |
            Nombre de la propiedad del cuerpo de la petición que no es válida. Los elementos de una
            lista se indican con su posición desde 0 (por ejemplo, `classes[1].name`)
        code:
          $ref: '#/components/schemas/FieldErrorCode'
    ValidationErrorResponse:
      # Esquema independiente y no `allOf` sobre ErrorResponse: con `additionalProperties: false`
      # en `error`, la composición rechazaría el `details` redefinido (design.md D1).
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Descripción en castellano para desarrolladores; no se muestra al usuario
            details:
              type: array
              description: Un elemento por cada campo no válido (solo con `VALIDATION_ERROR`)
              items:
                $ref: '#/components/schemas/FieldError'
    CaptchaToken:
      type: object
      description: |
        Token de reCAPTCHA y versión con la que se obtuvo; cada versión se verifica con una
        clave secreta distinta.
      required: [version, token]
      additionalProperties: false
      properties:
        version:
          type: string
          enum: [v3, v2]
        token:
          type: string
          minLength: 1
    InvitationLookupRequest:
      type: object
      description: |
        Token del enlace de invitación (el fragmento de `<origen>/invitacion#<token>`). Las
        propiedades que no figuran en este esquema se ignoran.
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
          description: |
            Token opaco de 256 bits en base64url. Un valor ausente, vacío o que no es una cadena
            responde `410 ACCESS_LINK_INVALID`, igual que un enlace inexistente.
    InvitationLookupResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [school, role]
          additionalProperties: false
          properties:
            school:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
            role:
              type: string
              enum: [ADMIN, MEMBER]
              description: Rol con el que se invita
    PasswordReset:
      type: object
      description: Restablecimiento pendiente; nunca incluye el token, su hash ni el enlace
      required: [userId, createdAt, expiresAt]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
          description: Usuario cuya contraseña se restablece
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Instante de creación más 72 horas
    PasswordResetCreatedResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [passwordReset, url]
          additionalProperties: false
          properties:
            passwordReset:
              $ref: '#/components/schemas/PasswordReset'
            url:
              type: string
              description: |
                Enlace completo (`<origen>/restablecer#<token>`). Solo se devuelve en esta respuesta.
    PasswordResetLookupRequest:
      type: object
      description: |
        Token del enlace de restablecimiento (el fragmento de `<origen>/restablecer#<token>`). Las
        propiedades que no figuran en este esquema se ignoran.
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
          description: |
            Token opaco de 256 bits en base64url. Un valor ausente, vacío o que no es una cadena
            responde `410 ACCESS_LINK_INVALID`, igual que un enlace inexistente.
    PasswordResetLookupResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [school, email]
          additionalProperties: false
          properties:
            school:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
            email:
              type: string
              description: Email de la cuenta con el local enmascarado (`a***@example.com`)
    ConfirmPasswordResetRequest:
      type: object
      description: |
        Token del enlace y contraseña nueva. Las propiedades que no figuran en este esquema se
        ignoran, incluidos `userId`, `email` y `role`: la cuenta sale del enlace.
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 200
          description: Token del enlace de restablecimiento
        password:
          type: string
          format: password
          maxLength: 72
          description: |
            De 8 caracteres a 72 bytes en UTF-8, con las mismas reglas de variedad que el registro.
    AcceptInvitationRequest:
      type: object
      description: |
        Datos de la persona invitada. Solo se declaran las longitudes máximas: las reglas completas
        de cada campo son las del registro (US01_b). Las propiedades que no figuran en este esquema
        se ignoran, incluidos `role` y `schoolId`: el colegio y el rol salen de la invitación.
      required: [token, firstName, lastName, email, password, privacyPolicyAccepted]
      properties:
        token:
          type: string
          maxLength: 200
          description: Token del enlace de invitación
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 72
          description: |
            De 8 caracteres a 72 bytes en UTF-8, con las mismas reglas de variedad que el registro.
        privacyPolicyAccepted:
          type: boolean
          const: true
          description: |
            Aceptación expresa de la política de privacidad (`/privacidad`). Es obligatoria y solo
            vale `true`: el backend guarda la fecha de la aceptación y la versión vigente.
    InvitationAcceptedResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, school]
          additionalProperties: false
          properties:
            user:
              type: object
              required: [id, firstName, lastName, email, role]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, MEMBER]
            school:
              type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
    RegisterRequest:
      type: object
      description: |
        Datos del registro. Solo se declaran las longitudes máximas: las reglas completas de
        cada campo (caracteres permitidos, longitudes mínimas, formato del email y variedad de
        la contraseña) las valida el backend y se describen en la historia US01. Las propiedades
        que no figuran en este esquema se ignoran.
      required:
        [
          schoolName,
          municipalityCode,
          firstName,
          lastName,
          email,
          password,
          privacyPolicyAccepted,
          captcha,
        ]
      properties:
        schoolName:
          type: string
          maxLength: 150
        municipalityCode:
          type: string
          pattern: '^\d{5}$'
          description: |
            Código INE del municipio del colegio (2 dígitos de provincia y 3 de municipio),
            tomado de `GET /api/municipalities`.
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 72
          description: |
            De 8 caracteres a 72 bytes en UTF-8: Bcrypt ignora el resto, así que se rechaza en
            lugar de truncarla. Las letras con acento y los símbolos fuera de ASCII ocupan 2 bytes
            o más, por lo que el límite en caracteres puede ser menor que 72.
        privacyPolicyAccepted:
          type: boolean
          const: true
          description: |
            Aceptación expresa de la política de privacidad (`/privacidad`). Es obligatoria y solo
            vale `true`: el backend guarda la fecha de la aceptación y la versión de la política
            vigente. Un valor ausente, `false` o de otro tipo es `400 VALIDATION_ERROR`.
        captcha:
          $ref: '#/components/schemas/CaptchaToken'
    LoginRequest:
      type: object
      description: |
        Credenciales del login. Solo se declaran las longitudes máximas: el backend recorta y pasa
        a minúsculas el email, lo valida con el formato del registro y exige una contraseña no
        vacía de hasta 72 bytes en UTF-8, sin las reglas de variedad del registro (solo valen para
        contraseñas nuevas). Las propiedades que no figuran en este esquema se ignoran.
      required: [email, password, captcha]
      properties:
        email:
          type: string
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 72
          description: |
            Hasta 72 bytes en UTF-8, el límite de Bcrypt; una más larga es `400 VALIDATION_ERROR`
            con `INVALID_LENGTH`.
        captcha:
          $ref: '#/components/schemas/CaptchaToken'
    RegisteredUser:
      type: object
      required: [id, email, firstName, lastName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Email normalizado (sin espacios al inicio ni al final y en minúsculas)
        firstName:
          type: string
        lastName:
          type: string
    Municipality:
      type: object
      required: [code, name, province]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^\d{5}$'
          description: Código INE (2 dígitos de provincia y 3 de municipio)
        name:
          type: string
          description: Nombre oficial, que puede tener dos formas (p. ej. «Alacant/Alicante»)
        province:
          type: string
    RegisteredSchool:
      type: object
      required: [id, name, municipality]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        municipality:
          $ref: '#/components/schemas/Municipality'
    RegisterResponse:
      type: object
      description: Respuesta del alta; nunca incluye la contraseña ni su hash
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [user, school]
          additionalProperties: false
          properties:
            user:
              $ref: '#/components/schemas/RegisteredUser'
            school:
              $ref: '#/components/schemas/RegisteredSchool'
    Session:
      type: object
      description: Access token en memoria del cliente; nunca se persiste en el navegador
      required: [accessToken, expiresIn]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT HS256 con `sub` (id del usuario), `schoolId` y `role`
        expiresIn:
          type: integer
          description: Segundos de validez del access token
          const: 900
    SessionUser:
      type: object
      required: [id, email, firstName, lastName, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
    SessionSchool:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SessionResponse:
      type: object
      description: Sesión renovada; nunca incluye el refresh token ni su hash
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [session, user, school]
          additionalProperties: false
          properties:
            session:
              $ref: '#/components/schemas/Session'
            user:
              $ref: '#/components/schemas/SessionUser'
            school:
              $ref: '#/components/schemas/SessionSchool'
  headers:
    RefreshTokenCookie:
      description: |
        Cookie de sesión con el refresh token opaco:
        `refresh_token=<token>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth; Max-Age=86400`.
        No es legible desde JavaScript y solo se envía a `/api/auth`.
      required: true
      schema:
        type: string
    NoStore:
      description: La respuesta contiene credenciales y no se almacena en caché (`no-store`)
      required: true
      schema:
        type: string
        const: no-store
  responses:
    Unauthorized:
      description: |
        No hay una sesión válida para el access token: falta la cabecera `Authorization` o no es
        `Bearer`, el token no es válido o ha caducado, su sesión no existe, está revocada o
        caducada, o su usuario no está activo. No se indica cuál de los casos es.
      headers:
        WWW-Authenticate:
          description: Esquema de autenticación esperado (`Bearer`)
          required: true
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_SESSION
              message: La sesión no es válida
    Forbidden:
      description: El usuario autenticado no tiene el rol que exige la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: No tienes permiso para realizar esta operación
    UserNotFound:
      description: |
        El usuario no existe en el colegio del administrador: el identificador es de otro colegio,
        no existe, corresponde a un usuario eliminado o no es un UUID. No se distingue el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: El usuario no existe
    ProfessorNotFound:
      description: |
        El profesor no existe en el colegio de la persona que hace la petición: el identificador es de
        otro colegio, no existe o no es un UUID. No se distingue el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: El profesor no existe
    CalendarNotFound:
      description: |
        El calendario no existe en el colegio de la persona que hace la petición: el identificador es de
        otro colegio, no existe o no es un UUID. No se distingue el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: El calendario no existe
    StudentNotFound:
      description: |
        El alumno no existe en el colegio de la persona que hace la petición: el identificador es de
        otro colegio, no existe o no es un UUID. No se distingue el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: El alumno no existe
    CourseNotFound:
      description: |
        El curso no existe en el colegio de la persona que hace la petición: el identificador es de
        otro colegio, no existe o no es un UUID. No se distingue el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: El curso no existe
    SchoolUserUpdated:
      description: |
        Usuario tras la operación, con los mismos campos que un elemento de `GET /api/users`. Si la
        operación no cambió nada (el usuario ya estaba en el estado pedido), devuelve el usuario tal
        cual.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchoolUserResponse'
          example:
            success: true
            data:
              id: 0b8f1e6a-6f4e-4d8a-9a51-2c3f7d9e8b10
              firstName: José María
              lastName: García-López
              email: jose.garcia@example.com
              role: MEMBER
              status: SUSPENDED
              passwordResetPending: false
              createdAt: '2026-10-07T09:30:00.000Z'
    InvitationNotFound:
      description: |
        La invitación no existe en el colegio del administrador: el identificador es de otro colegio,
        no existe, no es un UUID o corresponde a un enlace que no es una invitación. No se distingue
        el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: La invitación no existe
    AccessLinkInvalid:
      description: |
        El enlace no es válido: está caducado, usado o revocado, no existe, corresponde a un
        restablecimiento de contraseña o no se ha enviado el token. No se distingue el caso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ACCESS_LINK_INVALID
              message: El enlace no es válido o ha caducado
    InvalidJson:
      description: El cuerpo de la petición no es JSON válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_JSON
              message: El cuerpo de la petición no es JSON válido
    PayloadTooLarge:
      description: El cuerpo de la petición supera el límite de 100 KB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: PAYLOAD_TOO_LARGE
              message: El cuerpo de la petición supera el tamaño máximo permitido
    UnsupportedMediaType:
      description: El `charset` o el `Content-Encoding` del cuerpo no está soportado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: La codificación del cuerpo de la petición no está soportada
    NotFound:
      description: La ruta no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: La ruta solicitada no existe
    InternalError:
      description: Error no controlado; la traza solo se registra en el log
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Error interno del servidor
    ServiceUnavailable:
      description: |
        Servicio no disponible: la base de datos no responde (`DATABASE_UNAVAILABLE`) o la
        petición ha superado el timeout de 10 segundos (`REQUEST_TIMEOUT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            databaseUnavailable:
              summary: Base de datos no disponible
              value:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: La base de datos no está disponible
            requestTimeout:
              summary: Timeout de la petición
              value:
                success: false
                error:
                  code: REQUEST_TIMEOUT
                  message: La petición ha superado el tiempo máximo de respuesta
    ValidationError:
      description: |
        La entrada no es válida (`VALIDATION_ERROR`), con un elemento en `details` por cada
        campo no válido. El cuerpo JSON mal formado (`INVALID_JSON`) también responde `400`
        con este mismo formato, sin `details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            validationError:
              summary: Campos no válidos
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: La petición contiene campos no válidos
                  details:
                    - field: email
                      code: INVALID_FORMAT
                    - field: password
                      code: INVALID_LENGTH
            invalidJson:
              summary: Cuerpo JSON mal formado
              value:
                success: false
                error:
                  code: INVALID_JSON
                  message: El cuerpo de la petición no es JSON válido
    TooManyRequests:
      description: Se ha superado el límite de peticiones; `Retry-After` indica cuándo reintentar
      headers:
        Retry-After:
          description: Segundos que faltan para poder reintentar
          required: true
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: TOO_MANY_REQUESTS
              message: Se ha superado el número máximo de intentos
