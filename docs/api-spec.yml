                        courseName: 1º Primaria
                    - id: 0192f5a0-0000-7000-8000-0000000000f2
                      firstName: Luis
                      lastName: Pérez
                      position: null
                      subjects: []
                      tutoredClass: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
