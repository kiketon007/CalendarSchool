                    createdAt: '2026-10-17T10:00:00.000Z'
                    expiresAt: '2026-10-20T10:00:00.000Z'
                  url: https://app.calendarschools.es/restablecer#q3V9x2mZ8kLw0pTn5RbYtG1sHcJdFuAeNoPiKaXlMvE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: El usuario está `SUSPENDED` (`USER_NOT_ACTIVE`); primero se reactiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: USER_NOT_ACTIVE
                  message: El usuario no está activo
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/users/{id}/password-reset/revoke:
    post:
      tags: [Users]
      operationId: revokePasswordReset
      summary: Revoca el restablecimiento pendiente de un usuario
      security:
        - bearerAuth: []
      description: |
        Revoca el restablecimiento pendiente del usuario: su enlace deja de funcionar. Solo para el
        rol `ADMIN`; no tiene cuerpo.

        Es idempotente: un usuario del colegio sin restablecimiento pendiente responde `204` sin
        cambiar nada. Un identificador de otro colegio, inexistente, eliminado o que no es un UUID
        responde `404`, sin distinguir los casos.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Restablecimiento revocado (o no había ninguno pendiente)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/password-resets/lookup:
    post:
      tags: [PasswordResets]
      operationId: lookupPasswordReset
      summary: Consulta el colegio y el email de un restablecimiento
      # Endpoint público: lo usa la persona que no puede iniciar sesión.
      security: []
      description: |
        Dado el token de un enlace de restablecimiento (el fragmento de `<origen>/restablecer#<token>`),
        devuelve el nombre del colegio y el email de la cuenta con el local enmascarado, para mostrarlos
        antes de elegir la contraseña. **No consume el enlace ni escribe nada**: abrirlo, o que una
        aplicación de mensajería genere su vista previa, no lo invalida.

        El token viaja en el cuerpo, nunca en la ruta ni en la consulta. Un enlace caducado, usado,
        revocado, inexistente, que corresponde a una invitación, de un usuario que ya no está
        `ACTIVE` o sin `token` responde `410 ACCESS_LINK_INVALID`, sin distinguir el caso.

        Límite de intentos: comparte con `POST /api/password-resets/confirm` el máximo por IP
        (`PASSWORD_RESET_ATTEMPTS_MAX`, 10 por defecto) en una ventana de 15 minutos, independiente
        del de las invitaciones. Solo cuentan las peticiones con un enlace no válido; con el límite
        agotado responde `429` sin comprobar el enlace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetLookupRequest'
            example:
              token: 3q2-7wQ1xk0L9mZr4bT8aVn5cY6dEfGhJiKlMnOpQrS
      responses:
        '200':
          description: Restablecimiento pendiente, con el colegio y el email enmascarado
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLookupResponse'
              example:
                success: true
                data:
                  school:
                    name: CEIP Lluís Vives
                  email: a***@example.com
        '410':
          $ref: '#/components/responses/AccessLinkInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Se han superado los intentos con un enlace no válido por IP en 15 minutos. `Retry-After`
            indica los segundos que faltan para que el intento más antiguo salga de la ventana.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/password-resets/confirm:
    post:
      tags: [PasswordResets]
      operationId: confirmPasswordReset
      summary: Confirma un restablecimiento y fija la contraseña nueva
      # Endpoint público: lo usa la persona que no puede iniciar sesión.
      security: []
      description: |
        Cambia la contraseña de la cuenta del enlace, marca el enlace como usado y revoca todas las
        sesiones abiertas de la cuenta, en una única operación: si dos personas envían el mismo
        enlace a la vez, solo una lo consigue. La cuenta sale siempre del enlace.

        Orden de procesamiento: límite de intentos (`429`) → enlace pendiente (`410`) → validación de
        la contraseña (`400`) → cambio (`204` o `410`). El enlace se comprueba antes que la
        contraseña para que nadie sin un enlace válido obtenga información.

        La contraseña sigue las reglas del registro. **No inicia sesión**: no fija ninguna cookie ni
        devuelve tokens. El cliente lleva a la persona a `/login`.

        Límite de intentos: comparte con `POST /api/password-resets/lookup` el máximo por IP
        (`PASSWORD_RESET_ATTEMPTS_MAX`, 10 por defecto) en una ventana de 15 minutos. Solo cuentan las
        peticiones con un enlace no válido (`410`); los `400` no cuentan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordResetRequest'
            example:
              token: 3q2-7wQ1xk0L9mZr4bT8aVn5cY6dEfGhJiKlMnOpQrS
              password: Secreta123!
      responses:
        '204':
          description: Contraseña cambiada y sesiones anteriores revocadas; sin sesión nueva
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          $ref: '#/components/responses/AccessLinkInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Se han superado los intentos con un enlace no válido por IP en 15 minutos. `Retry-After`
            indica los segundos que faltan para que el intento más antiguo salga de la ventana.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/courses:
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Crea un curso con sus clases
      security:
        - bearerAuth: []
      description: |
        Crea, en una única transacción, un curso del colegio de la persona que hace la petición con
        todas sus clases: o se crea todo o no se crea nada. Disponible para los roles `ADMIN` y
        `MEMBER`; se autentica con el access token y no exige la cabecera `Origin`. El colegio sale
        siempre de la sesión: el cuerpo no puede indicarlo y se ignoran las propiedades desconocidas
        (también un `tutorId`).

        **Reglas.** El nombre del curso tiene de 1 a 100 caracteres tras recortar los espacios (los
        repetidos se colapsan) y admite letras, dígitos, `º`, `ª`, `-`, `/` y espacios. El curso tiene
        de 1 a 12 clases; el nombre de cada clase tiene de 1 a 10 caracteres y admite letras, dígitos,
        `º`, `ª`, `-` y espacios. Los nombres se comparan sin distinguir mayúsculas ni espacios
        sobrantes: el del curso debe ser único en el colegio y el de la clase, dentro del curso.

        Los errores de validación llevan en `details` un elemento por campo (`name`, `classes` o
        `classes[<i>].name`, con `i` desde 0). Una clase repetida dentro del curso se indica con
        `DUPLICATE` en la segunda y siguientes apariciones.

        El tutor de las clases es opcional: las clases nacen sin tutor (`tutor` es `null`) y se le da
        uno desde la ficha del profesor (`POST /api/professors`). Un curso recién creado no tiene
        alumnos: `studentCount` es `0` en el curso y en cada clase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              name: 1º Primaria
              classes:
                - name: A
                - name: B
      responses:
        '201':
          description: Curso creado con sus clases, en el orden recibido
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCreatedResponse'
              example:
                success: true
                data:
                  course:
                    id: 0192f5a0-0000-7000-8000-0000000000d1
                    name: 1º Primaria
                    createdAt: '2026-10-19T09:30:00.000Z'
                    studentCount: 0
                    classes:
                      - id: 0192f5a0-0000-7000-8000-0000000000e1
                        name: A
                        tutor: null
                        studentCount: 0
                      - id: 0192f5a0-0000-7000-8000-0000000000e2
                        name: B
                        tutor: null
                        studentCount: 0
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Ya existe en el colegio un curso con ese nombre (`COURSE_ALREADY_EXISTS`), sin distinguir
            mayúsculas ni espacios sobrantes. No se crea nada. Otro colegio sí puede tener un curso con
            el mismo nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: COURSE_ALREADY_EXISTS
                  message: Ya existe un curso con ese nombre en el colegio
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Courses]
      operationId: listCourses
      summary: Lista los cursos del colegio con sus clases
      security:
        - bearerAuth: []
      description: |
        Devuelve los cursos del colegio de la persona que hace la petición, y solo esos, cada uno con
        sus clases. Disponible para los roles `ADMIN` y `MEMBER`. Cursos y clases van ordenados por
        nombre con la comparación del castellano y numérica («2º» antes que «10º»). Sin paginación y
        sin búsqueda: el filtro por nombre lo hace el navegador y cualquier parámetro de la consulta se
        ignora. Cada curso lleva `createdAt`. `tutor` es el profesor que tutoriza la clase (`id`, `firstName` y
        `lastName`) o `null` si no tiene. `studentCount` (del curso y de cada clase) es el número de
        alumnos asignados; los del curso sin clase son la diferencia entre el del curso y la suma de
        los de sus clases.
      responses:
        '200':
          description: Cursos del colegio (un array vacío si no tiene ninguno)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
              example:
                success: true
                data:
                  courses:
                    - id: 0192f5a0-0000-7000-8000-0000000000d1
                      name: 1º Primaria
                      createdAt: '2026-10-19T09:30:00.000Z'
                      studentCount: 0
                      classes:
                        - id: 0192f5a0-0000-7000-8000-0000000000e1
                          name: A
                          tutor: null
                          studentCount: 0
                        - id: 0192f5a0-0000-7000-8000-0000000000e2
                          name: B
                          tutor: null
                          studentCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/courses/{id}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Devuelve un curso del colegio con sus clases
      security:
        - bearerAuth: []
      description: |
        Devuelve el curso con ese identificador si es del colegio de la persona que hace la petición,
        con la misma forma que en el listado y las clases ordenadas por nombre con la comparación del
        castellano y numérica, también `studentCount`. Disponible para los roles `ADMIN` y `MEMBER`. Un curso de otro colegio,
        inexistente o con un identificador que no es un UUID responde `404` sin distinguir el caso.
      responses:
        '200':
          description: El curso con sus clases
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
              example:
                success: true
                data:
                  course:
                    id: 0192f5a0-0000-7000-8000-0000000000d1
                    name: 1º Primaria
                    createdAt: '2026-10-19T09:30:00.000Z'
                    studentCount: 0
                    classes:
                      - id: 0192f5a0-0000-7000-8000-0000000000e1
                        name: A
                        tutor: null
                        studentCount: 0
                      - id: 0192f5a0-0000-7000-8000-0000000000e2
                        name: B
                        tutor: null
                        studentCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Courses]
      operationId: updateCourse
      summary: Edita el nombre de un curso y sus clases
      security:
        - bearerAuth: []
      description: |
        Deja el curso exactamente en el estado recibido, en una única transacción: o se guarda todo o
        no se guarda nada. Disponible para los roles `ADMIN` y `MEMBER`; se autentica con el access
        token y no exige la cabecera `Origin`. El colegio sale siempre de la sesión y se ignoran las
        propiedades desconocidas.

        **Identidad de las clases.** Una clase con `id` conserva ese `id` y toma el nombre recibido;
        una clase sin `id` se crea; una clase del curso cuyo `id` no aparece se borra. Un intercambio
        de nombres entre clases, o reutilizar el de una clase quitada, se guarda sin error. Un `PUT`
        idéntico al estado guardado responde `200` sin cambiar nada.

        **Reglas.** Las mismas de `POST /api/courses`. Además, cada `id` de clase debe ser un UUID
        (`INVALID_FORMAT` en `classes[<i>].id`) y no puede repetirse (`DUPLICATE` en `classes[<i>].id`,
        desde la segunda aparición). El propio curso no cuenta para la unicidad de su nombre: cambiar
        solo mayúsculas o espacios se acepta.

        **Tutores.** Cada clase puede llevar `tutorId`: omitido, el tutor de esa clase no cambia (una
        clase nueva nace sin tutor); `null`, la clase queda sin tutor; un UUID, ese profesor pasa a ser
        su tutor. El mismo profesor no puede elegirse en dos clases (`DUPLICATE` en
        `classes[<i>].tutorId`, desde la segunda), un `tutorId` que no es un UUID da `INVALID_FORMAT` y
        el de un profesor que no existe en el colegio (o es de otro), `NOT_FOUND`, sin distinguir los
        dos casos. Un profesor que ya tutoriza una clase de **otro curso** no puede asignarse: responde
        `409 PROFESSOR_ALREADY_TUTOR`. Uno que tutoriza una clase de este curso sí, siempre que esta
        misma petición la libere (se quita la clase o se le cambia el tutor), de modo que mover a un
        profesor entre clases o intercambiar los tutores de dos clases se guarda en una sola petición.

        **Concurrencia.** Si el cuerpo incluye el `id` de una clase que ya no pertenece al curso (otra
        persona la borró mientras se editaba, o es de otro curso) responde `409 COURSE_CHANGED` y no
        guarda nada. Si dos ediciones de cursos distintos asignan a la vez al mismo profesor, una
        responde `200` y la otra `409 PROFESSOR_ALREADY_TUTOR`. En lo demás prevalece el último
        guardado.

        **Alumnos.** Quitar una clase deja a sus alumnos en el curso, sin clase. El cuerpo no admite
        `studentCount`: si llega, se ignora como cualquier propiedad desconocida. La respuesta lleva
        el `studentCount` del estado final, contado después de guardar, del curso y de cada clase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
            example:
              name: 1º Primaria Tarde
              classes:
                - id: 0192f5a0-0000-7000-8000-0000000000e1
                  name: Grupo A
                  tutorId: 0192f5a0-0000-7000-8000-0000000000f1
                - name: C
                  tutorId: null
      responses:
        '200':
          description: El curso en su estado final, con las clases en el orden del listado
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
              example:
                success: true
                data:
                  course:
                    id: 0192f5a0-0000-7000-8000-0000000000d1
                    name: 1º Primaria Tarde
                    createdAt: '2026-10-19T09:30:00.000Z'
                    studentCount: 0
                    classes:
                      - id: 0192f5a0-0000-7000-8000-0000000000e3
                        name: C
                        tutor: null
                        studentCount: 0
                      - id: 0192f5a0-0000-7000-8000-0000000000e1
                        name: Grupo A
                        tutor: null
                        studentCount: 0
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          description: |
            Tres casos, que se distinguen por `error.code`. `COURSE_ALREADY_EXISTS`: otro curso del
            colegio ya tiene ese nombre, sin distinguir mayúsculas ni espacios sobrantes. `COURSE_CHANGED`:
            el cuerpo incluye una clase que ya no pertenece al curso. `PROFESSOR_ALREADY_TUTOR`: un
            profesor elegido ya tutoriza una clase que esta edición no libera (de otro curso, o porque
            otra petición se la asignó a la vez). En los tres casos no se guarda nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyExists:
                  summary: Otro curso del colegio ya usa el nombre
                  value:
                    success: false
                    error:
                      code: COURSE_ALREADY_EXISTS
                      message: Ya existe un curso con ese nombre en el colegio
                changed:
                  summary: Una clase del cuerpo ya no pertenece al curso
                  value:
                    success: false
                    error:
                      code: COURSE_CHANGED
                      message: El curso ha cambiado desde que se cargó
                professorAlreadyTutor:
                  summary: Un profesor elegido ya tutoriza otra clase
                  value:
                    success: false
                    error:
                      code: PROFESSOR_ALREADY_TUTOR
                      message: El profesor ya es tutor de otra clase
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: Borra un curso del colegio con sus clases
      security:
        - bearerAuth: []
      description: |
        Borra de verdad, en una única transacción, el curso del colegio de la persona que hace la
        petición y todas sus clases (la base de datos las borra en cascada); no hay papelera. Disponible
        para los roles `ADMIN` y `MEMBER`; se autentica con el access token y no exige la cabecera
        `Origin`. La petición no lleva cuerpo. El curso queda bloqueado mientras se cuenta y se borra,
        así que una edición simultánea (`PUT`) espera y, si se procesa después, recibe `404`; de dos
        borrados simultáneos, uno responde `200` y el otro `404`.

        La respuesta dice lo que se borró de verdad (`deleted`), contado en la misma transacción: puede
        diferir de lo que mostró `GET /api/courses/{id}/impact` si el curso cambió entre medias. Un
        curso de otro colegio, inexistente, ya borrado o con un identificador que no es un UUID responde
        `404` sin distinguir el caso.
      responses:
        '200':
          description: Curso borrado; lo que se borró con él
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDeletedResponse'
              example:
                success: true
                data:
                  deleted:
                    classCount: 3
                    studentCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/courses/{id}/impact:
