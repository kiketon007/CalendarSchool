                      name: 1º Primaria
                    class:
                      id: 0192f5a0-0000-7000-8000-0000000000e1
                      name: A
                    cafeteria: true
                    scholarship: false
                    foodType: Vegetariana
                    observations: Necesita apoyo en lectura
        '400':
          $ref: '#/components/responses/ValidationError'
