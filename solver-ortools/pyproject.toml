# Motor de OR-Tools (US-ALGO-ORTOOLS). No es un paquete que se publique: solo configura las herramientas.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Los comentarios y docstrings en castellano pueden pasar de 100; el formateador cuida el código.
ignore = ["E501"]
